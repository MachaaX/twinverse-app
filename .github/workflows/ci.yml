name: TwinVerse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cloud.txt
            requirements-auth.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt -r requirements-cloud.txt -r requirements-auth.txt
      - name: Backend and deployment checks
        run: python -m unittest discover -s tests -v
      - name: Frontend checks
        run: node tests/test_frontend.cjs
      - name: Python syntax
        run: python -m compileall -q backend deploy run.py

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TwinVerse — a faculty-controlled virtual patient encounter workspace.">
  <title>TwinVerse · Clinical practice, thoughtfully connected</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/styles-vitals.css">
  <link rel="stylesheet" href="/auth.css">
  <!-- TalkingHead.js for 3D animated avatars (local copy for CSP compliance) -->
  <script src="/lib/talkinghead.mjs" type="module"></script>
  <script type="module" src="/app.js"></script>
</head>
<body class="auth-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <aside class="sidebar">
    <a class="brand" href="#cases" aria-label="TwinVerse home"><span class="brand-mark">✳</span><span>TwinVerse<small>CLINICAL SIMULATION</small></span></a>
    <div class="workspace-label">YOUR WORKSPACE</div>
    <nav id="navigation" aria-label="Main navigation"></nav>
    <div class="sidebar-bottom">
      <div id="sidebar-account" class="sidebar-account"></div>
      <div class="local-status"><span class="status-dot"></span> Local sample workspace <span>v1.0</span></div>
    </div>
  </aside>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand auth-header-brand" href="#login" aria-label="TwinVerse home"><span class="brand-mark" aria-hidden="true">✳</span><span>TwinVerse<small>CLINICAL SIMULATION</small></span></a>
      <div class="breadcrumb"><span>Workspace</span><span class="slash">/</span><strong id="page-label">Practice library</strong></div>
      <div class="topbar-actions"><span class="demo-tag">SYNTHETIC DATA</span><span id="report-slot"></span><div id="account-slot" class="account-slot"></div></div>
    </header>
    <main id="main" tabindex="-1"><div class="loading-state"><span class="spinner"></span> Opening your workspace…</div></main>
    <footer class="app-footer"><span>TwinVerse / Rutgers Health Hackathon prototype</span><span>Synthetic data only · AI replies grounded in approved facts</span></footer>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="confirm-dialog"><div id="confirm-content"></div></dialog>
</body>
</html>
